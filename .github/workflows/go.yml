# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "ecommerce" ]
  pull_request:
    branches: [ "ecommerce" ]

jobs:

  build:
    runs-on: ubuntu-latest
    environment: ecommerce
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.20'

    - name: Build
      env:
              GIT_USERNAME: ${{ secrets.GIT_USERNAME }}
              GIT_PASSWORD: ${{ secrets.GIT_PASSWORD }}
              SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
              SSH_SERVER: ${{ vars.SSH_SERVER }}
              SSH_USER: ${{ vars.SSH_USER }}
              SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      run: |
        mkdir -p ~/.ssh
        echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519

        ssh -o StrictHostKeyChecking=no $SSH_USER@$SSH_SERVER << 'EOF'
          set -e
          cd /usr/app/ecommerce/ecommerce_main/transaction-service
          git stash
          git pull origin ecommerce
          go build -o transaction-service
          pm2 restart transaction-service || \
          pm2 start transaction-service --name ecommerce-transaction-service
        EOF
